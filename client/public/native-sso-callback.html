<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting to Eidola...</title>
  <script>
    // Immediately redirect to eidola:// scheme
    // This must happen before the React app loads
    (function() {
      var params = new URLSearchParams(window.location.search);
      params.delete('native'); // Remove the native flag
      var queryString = params.toString();
      var redirectUrl = 'eidola://sso-callback' + (queryString ? '?' + queryString : '');
      console.log('[native-sso-callback] Redirecting to:', redirectUrl);
      window.location.replace(redirectUrl);
    })();
  </script>
</head>
<body>
  <div style="display: flex; justify-content: center; align-items: center; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif;">
    <div style="text-align: center;">
      <div style="width: 48px; height: 48px; border: 3px solid #f59e0b; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto;"></div>
      <p style="margin-top: 16px; color: #6b7280;">Returning to app...</p>
    </div>
  </div>
  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</body>
</html>
